<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sheets Vim Navigation — Options</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        max-width: 640px;
        line-height: 1.5;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p.hint {
        margin: 0 0 20px;
        opacity: 0.7;
        font-size: 13px;
      }
      section {
        margin-bottom: 28px;
      }
      h2 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.6;
        margin: 0 0 12px;
      }
      .row {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 12px;
        align-items: center;
        margin-bottom: 8px;
      }
      label {
        font-size: 14px;
      }
      input[type='text'],
      textarea,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: inherit;
        font-size: 13px;
        border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
        border-radius: 4px;
        background: transparent;
        color: inherit;
      }
      input.mono {
        font-family: monospace;
      }
      textarea {
        min-height: 90px;
        font-family: monospace;
        resize: vertical;
      }
      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        position: sticky;
        bottom: 0;
        padding: 12px 0;
        background: Canvas;
      }
      button {
        font: inherit;
        padding: 8px 16px;
        border-radius: 6px;
        border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button.primary {
        background: #2e7d32;
        border-color: #2e7d32;
        color: #fff;
      }
      #status {
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.15s;
      }
      #status.show {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <h1>Sheets Vim Navigation</h1>
    <p class="hint">
      Keys can be single characters (<code>j</code>), named keys (<code>Escape</code>), or modified
      keys (<code>Ctrl-r</code>). Space-separate keys to make a sequence (<code>g g</code> = press
      <code>g</code> twice). Separate alternative bindings with commas.
    </p>
    <form id="form">
      <section>
        <h2>Keymap</h2>
        <div id="keymap"></div>
      </section>
      <section>
        <h2>Trigger URLs</h2>
        <p class="hint">One glob pattern per line. <code>*</code> matches anything.</p>
        <textarea id="urlPatterns"></textarea>
      </section>
      <section>
        <h2>Overlay</h2>
        <div class="row">
          <label for="overlayPosition">Position</label>
          <select id="overlayPosition">
            <option value="bottomLeft">Bottom left</option>
            <option value="bottomRight">Bottom right</option>
          </select>
        </div>
        <div class="row">
          <label for="enabled">Enabled</label>
          <input type="checkbox" id="enabled" style="justify-self: start; width: auto" />
        </div>
      </section>
      <div class="actions">
        <button type="submit" class="primary">Save</button>
        <button type="button" id="reset">Reset to defaults</button>
        <span id="status">Saved</span>
      </div>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
