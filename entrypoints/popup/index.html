<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sheets Vim Navigation</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        width: 220px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 14px;
      }
      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        font-size: 14px;
      }
      button {
        width: 100%;
        font: inherit;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Sheets Vim Navigation</h1>
    <div class="toggle">
      <label for="enabled">Enabled</label>
      <input type="checkbox" id="enabled" />
    </div>
    <button id="options" type="button">Open options</button>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
